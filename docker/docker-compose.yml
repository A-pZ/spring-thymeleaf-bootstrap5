version: '3'
services:
  mysql8:
    image: mysql:8.0.40
    container_name: mysql8_docker
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: test
      MYSQL_USER: mysql
      MYSQL_PASSWORD: password
      TZ: 'JST'
    ports:
      - "3306"
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
