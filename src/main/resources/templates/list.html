<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<table class="table table-bordered table-striped text-nowrap" th:if="${items}">
    <thead>
        <tr>
            <th>#id</th>
            <th>name</th>
            <th>price</th>
            <th>stock</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.id}">1</td>
            <td th:text="${item.name}">name</td>
            <td th:text="${item.price}">100</td>
            <td th:text="${item.stock}">10</td>
        </tr>
    </tbody>
</table>
