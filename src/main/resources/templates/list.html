<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!-- Pager -->
<div th:if="${pages}">
    <ul class="pagination" th:with="listurl='/list'">
        <li class="page-item" th:if="${! pages.first}">
            <a class="page-link" href="#" aria-label="Previous"
               th:attr="hx-get=${listurl + '?page=' + pages.previousPageable().pageNumber}" hx-trigger="click" hx-target="#result-table">
                <span aria-hidden="true">&lt;</span>
            </a>
        </li>
        <li class="page-item" th:each="seq : ${#numbers.sequence(0, pages.totalPages-1)}">
            <a class="page-link" href="#"
               th:attr="hx-get=${listurl + '?page=' + seq}" hx-trigger="click" hx-target="#result-table"
               th:text="${seq + 1}"
               th:classappend="${seq == pages.pageable.pageNumber ? 'active' : ''}"></a>
        </li>
        <li class="page-item" th:if="${! pages.last}">
            <a class="page-link" href="#" aria-label="Next"
               th:attr="hx-get=${listurl + '?page=' + pages.nextPageable().pageNumber}" hx-trigger="click" hx-target="#result-table">
                <span aria-hidden="true">&gt;</span>
            </a>
        </li>
    </ul>
</div>

<table class="table table-bordered table-striped text-nowrap" th:if="${pages}">
    <thead>
        <tr>
            <th>#id</th>
            <th>name</th>
            <th>price</th>
            <th>stock</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="item : ${pages.getContent()}">
            <td th:text="${item.id}">1</td>
            <td th:text="${item.name}">name</td>
            <td th:text="${item.price}">100</td>
            <td th:text="${item.stock}">10</td>
        </tr>
    </tbody>
</table>
